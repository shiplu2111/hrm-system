name: Deploy to EC2 Production

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.212.251.195
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 45m
          command_timeout: 45m
          script: |
            set -e
            # 1. Swap memory guard (t2.micro / t3.micro)
            echo "==== 1. Free VPS Memory Guard (2GB Swap) ===="
            if [ ! -f /swapfile ]; then
              echo "Creating 2GB swap space for AWS Free Tier..."
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
              if ! grep -q "/swapfile" /etc/fstab; then
                echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              fi
              echo "Swap activated successfully."
            else
              sudo swapon /swapfile 2>/dev/null || true
              echo "Swap file already exists."
            fi
            free -m

            # 2. Pull code
            echo "==== 2. Pulling latest code ===="
            cd ~/hrm-system
            git stash || true
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # 3. Rebuild containers (sequentially to save memory on 1GB VPS)
            echo "==== 3. Rebuilding and Starting Containers ===="
            export DOCKER_BUILDKIT=1
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml build admin
            docker compose -f docker-compose.prod.yml up -d

            # 4. Run Prisma Migrations and Seed
            echo "==== 4. Running Prisma Database Migrations and Seed ===="
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy || true
            docker compose -f docker-compose.prod.yml exec -T -w /app/apps/api api npx tsx prisma/seed.ts || true

            # 5. Check status and print container logs
            echo "==== 5. Deployment Complete! ===="
            docker compose -f docker-compose.prod.yml ps
            echo "==== 6. API Container Logs (Last 40 lines) ===="
            docker compose -f docker-compose.prod.yml logs --tail 40 api
            echo "==== 7. Admin Container Logs (Last 20 lines) ===="
            docker compose -f docker-compose.prod.yml logs --tail 20 admin

