# DEPLOYMENT.md §2 — production deploy with manual approval gate (GitHub environment protection).
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        default: main
      payroll_signoff:
        description: >-
          Payroll-affecting changes verified (TESTING.md / PAYROLL_LOGIC.md coverage reviewed)
        required: true
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify-inputs:
    name: Verify deploy inputs
    runs-on: ubuntu-latest
    steps:
      - name: Require payroll sign-off when applicable
        if: inputs.payroll_signoff != true
        run: |
          echo "Production deploy requires payroll_signoff=true (DEPLOYMENT.md §2, TESTING.md)."
          exit 1

  ci-gate:
    name: Verify CI passed on ref
    runs-on: ubuntu-latest
    needs: verify-inputs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci-gate
    environment:
      name: production
      url: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run database migrations (MIGRATIONS.md §8 — before traffic)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:production
            ghcr.io/${{ github.repository }}/api:${{ inputs.ref }}

      - name: Trigger production rollout
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "PRODUCTION_DEPLOY_WEBHOOK_URL not set — image pushed to GHCR only."
            echo "Configure the production environment secret after manual QA sign-off."
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${{ inputs.ref }}\",\"environment\":\"production\",\"image\":\"ghcr.io/${{ github.repository }}/api:${{ inputs.ref }}\",\"payroll_signoff\":${{ inputs.payroll_signoff }}}"
