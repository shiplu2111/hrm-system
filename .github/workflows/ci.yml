# TESTING.md §6 + DEPLOYMENT.md §2 — lint, type-check, test, build on every PR/push.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:ci

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  integration-test:
    name: Integration tests (E2E)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm_ci
          POSTGRES_DB: hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm -d hrms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: postgresql://hrm:hrm_ci@localhost:5432/hrms
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-32chars!!
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: ./apps/api/storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @hrm/shared-types
      - run: npm run prisma:generate
      - run: touch .env
      - run: npm run migrate:deploy
      - run: npm run seed
      - run: npm run test:e2e
